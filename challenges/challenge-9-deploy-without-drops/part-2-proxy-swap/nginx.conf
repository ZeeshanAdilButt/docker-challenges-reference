# The proxy in front of the two copies. run.mjs replaces __UPSTREAM__ with the name of the copy that gets traffic
# (blue first, then green) and asks nginx to reload this file. A reload is graceful: requests that are already
# being handled finish on the old workers.
upstream app {
  server __UPSTREAM__:8080;
}

server {
  listen 80;
  location / {
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 1s;
  }
}
