# A three-tier stack: web (nginx) -> api -> db (Postgres).
# run.mjs starts it, then scans what can be reached from where.
# The ports come from the environment: WEB_PORT, API_PORT and DB_PORT are free random ports chosen by run.mjs.
name: dkr-c7-p3

# Safety settings every service gets: the label for cleanup, and caps on memory, processes and logs.
x-safe: &safe
  labels:
    dkr.challenge: "7"
  mem_limit: 128m
  memswap_limit: 128m
  pids_limit: 100
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "1m", max-file: "2" }

services:
  web:
    <<: *safe
    image: nginx:1.27-alpine
    ports: ["${WEB_PORT}:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]

  api:
    <<: *safe
    image: dkr-c7-daftar-api:1
    ports: ["${API_PORT}:8080"]

  db:
    <<: *safe
    image: postgres:18-alpine
    mem_limit: 256m
    memswap_limit: 256m
    ports: ["${DB_PORT}:5432"]
    environment:
      POSTGRES_PASSWORD: dkr-demo-only
    tmpfs: ["/var/lib/postgresql:size=96m"]

networks:
  default:
    labels:
      dkr.challenge: "7"
