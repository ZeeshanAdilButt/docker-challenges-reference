# One Postgres database. run.mjs fills it, recreates it, loses it, and restores it from backups.
name: dkr-c7-p4

# Safety settings every service gets: the label for cleanup, and caps on memory, processes and logs.
x-safe: &safe
  labels:
    dkr.challenge: "7"
  mem_limit: 256m
  memswap_limit: 256m
  pids_limit: 100
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "1m", max-file: "2" }

services:
  db:
    <<: *safe
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: dkr-demo-only

networks:
  default:
    labels:
      dkr.challenge: "7"
