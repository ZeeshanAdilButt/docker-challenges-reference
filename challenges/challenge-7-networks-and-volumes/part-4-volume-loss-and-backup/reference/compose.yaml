# One Postgres database with its data in a named volume.
# The image stores its data in /var/lib/postgresql. Mounting a named volume there keeps the data
# when the container is removed and created again.
name: dkr-c7-p4

x-safe: &safe
  labels:
    dkr.challenge: "7"
  mem_limit: 256m
  memswap_limit: 256m
  pids_limit: 100
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "1m", max-file: "2" }

services:
  db:
    <<: *safe
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: dkr-demo-only
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
    labels:
      dkr.challenge: "7"

networks:
  default:
    labels:
      dkr.challenge: "7"
