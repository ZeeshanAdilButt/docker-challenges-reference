<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" fill="currentColor">
  <title id="t">Milliseconds to get an answer from the database port</title>
  <desc id="d">api to db (name): 21 ms. api to localhost: 23 ms. api to host.docker.internal: 27 ms. your computer to 127.0.0.1: 6 ms</desc>
