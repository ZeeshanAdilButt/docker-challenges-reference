# The pipeline for daftar-api. STARTER: it works, and it is not safe. Find what is wrong and fix it.
# (Run it in your own repository. This machine cannot run GitHub Actions.)
name: ship

on:
  pull_request_target:
    branches: [main]
  push:
    branches: [main]

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: not-a-real-token-1234
      - uses: docker/build-push-action@v7
        with:
          context: challenges/challenge-13-ship-it/app
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest

  deploy:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "deploying the latest tag"
