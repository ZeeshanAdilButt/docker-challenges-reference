  <text x="544" y="100" font-size="14">1 s</text>
  <text x="132" y="133" text-anchor="end" font-size="14">test</text>
  <rect x="148" y="119" width="386" height="20" rx="3" fill="currentColor" fill-opacity="0.08"/>
  <rect x="148" y="119" width="257.3" height="20" rx="3" fill="currentColor" fill-opacity="0.7"/>
  <text x="544" y="134" font-size="14">1.2 s</text>
