# The control for run.mjs: the right image (by digest) but no health check, so "up --wait" returns as soon as the
# container is running, not when it can take traffic. Do not edit this file.
services:
  api:
    image: ${REGISTRY}/dkr-c13/api@${DIGEST:?set DIGEST}
    environment:
      API_TOKEN: ${API_TOKEN:?set API_TOKEN}
      WARMUP_MS: "3000"
    mem_limit: 128m
    pids_limit: 100
    networks: [edge]

networks:
  edge:
    external: true
