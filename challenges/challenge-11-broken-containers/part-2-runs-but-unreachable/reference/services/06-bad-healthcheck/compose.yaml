name: dkr-c11-bad-healthcheck

# The safety cage for every challenge 11 service. Do not remove it.
x-cage: &cage
  labels:
    dkr.challenge: "11"
  mem_limit: 64m
  memswap_limit: 64m
  pids_limit: 50
  logging:
    driver: json-file
    options:
      max-size: 1m
      max-file: "2"
  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: *cage
    container_name: dkr-c11-bad-healthcheck
    image: dkr-c11/bad-healthcheck:1
    build: .
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 2
      start_period: 1s
    ports:
      - "127.0.0.1:18106:8080"

networks:
  default:
    labels:
      dkr.challenge: "11"
