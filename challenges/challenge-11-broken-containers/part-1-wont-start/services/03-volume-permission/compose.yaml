name: dkr-c11-volume-permission

# The safety cage for every challenge 11 service. Do not remove it.
x-cage: &cage
  labels:
    dkr.challenge: "11"
  mem_limit: 64m
  memswap_limit: 64m
  pids_limit: 50
  logging:
    driver: json-file
    options:
      max-size: 1m
      max-file: "2"
  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: *cage
    container_name: dkr-c11-volume-permission
    image: dkr-c11/volume-permission:1
    build: .
    volumes:
      - shop-data:/var/lib/shop
    ports:
      - "127.0.0.1:18103:8080"

volumes:
  shop-data:
    labels:
      dkr.challenge: "11"

networks:
  default:
    labels:
      dkr.challenge: "11"
