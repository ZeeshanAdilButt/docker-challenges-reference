# nginx for the Daftar web page. It listens on 8080 and keeps every file it writes under /tmp,
# so it can run as a normal user with a read-only root file system.
pid /tmp/nginx.pid;
worker_processes 1;
events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # Docker's own DNS. The variable makes nginx look the name up again, so a restarted API is found.
    resolver 127.0.0.11 valid=5s;

    location = /healthz { return 200 "ok\n"; }

    location /api/ {
      set $api http://api:8080;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $api;
    }

    location / { try_files $uri /index.html; }
  }
}
