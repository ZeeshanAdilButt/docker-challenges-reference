version: "3.8"

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: daftar
      POSTGRES_PASSWORD: supersecret-db-pass-2026
      POSTGRES_DB: daftar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://daftar:supersecret-db-pass-2026@db:5432/daftar
    ports:
      - "8080:8080"
    depends_on:
      - db

  worker:
    build: ./worker
    environment:
      API_URL: http://api:8080
    depends_on:
      - api

  web:
    build: ./web
    ports:
      - "3000:8080"
    depends_on:
      - api

volumes:
  pgdata:
