# The pipeline for the Daftar platform: test, build, scan, SBOM, sign, push, then hand the DIGESTS to the deploy job.
#
# This file is the GitHub half of the pipeline. This machine cannot run GitHub Actions, so the GitHub run is YOUR OWN:
# copy daftar-platform/ to your own repository, push a branch and open a pull request. The local equivalent that
# part 2 measures is run.mjs: the same stages in the same order against a registry on your machine.
# Expect on GitHub: a pull request builds and tests but pushes nothing; a push to main pushes sha-<7> and the version
# for api, worker and web, and the deploy job receives three digests.
#
# Every action is pinned to a full commit SHA, with the version in a comment.
name: ship

on:
  pull_request:            # NOT pull_request_target: that one runs fork code with your secrets
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions: {}            # nothing by default; each job asks for what it needs

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write      # push to GHCR with the built-in token
      id-token: write      # keyless signing (filled in after challenge 12)
    outputs:
      digest_api: ${{ steps.push_api.outputs.digest }}
      digest_worker: ${{ steps.push_worker.outputs.digest }}
      digest_web: ${{ steps.push_web.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta_api
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=sha
            type=semver,pattern={{version}}
      - id: meta_worker
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/worker
          tags: |
            type=sha
            type=semver,pattern={{version}}
      - id: meta_web
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=sha
            type=semver,pattern={{version}}
      - name: Unit tests of the api (the test stage; nothing is pushed if this fails)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./api
          target: test
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Scan and SBOM of the three images (filled in after challenge 12)
        run: echo "scan and sbom steps go here once challenge 12 gives you the tools"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push_api
        name: Build and push the api (only on main or a tag, never from a pull request)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - id: push_worker
        name: Build and push the worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./worker
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_worker.outputs.tags }}
          labels: ${{ steps.meta_worker.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - id: push_web
        name: Build and push the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./web
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Sign the three digests (filled in after challenge 12)
        if: github.event_name != 'pull_request'
        run: echo "sign ${{ steps.push_api.outputs.digest }} ${{ steps.push_worker.outputs.digest }} ${{ steps.push_web.outputs.digest }} here once challenge 12 gives you the tool"

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production   # add a required reviewer in the repository settings
    permissions:
      contents: read
    steps:
      - name: Deploy by digest (the production host in this course is on your machine; see part 2)
        env:
          DIGEST_API: ${{ needs.build.outputs.digest_api }}
          DIGEST_WORKER: ${{ needs.build.outputs.digest_worker }}
          DIGEST_WEB: ${{ needs.build.outputs.digest_web }}
        run: echo "deploy api@${DIGEST_API} worker@${DIGEST_WORKER} web@${DIGEST_WEB}"
