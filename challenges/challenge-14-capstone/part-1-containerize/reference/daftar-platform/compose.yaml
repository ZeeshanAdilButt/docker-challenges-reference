# The Daftar platform for development: one command, healthy in under a minute.
#   cp .env.example .env     (then set POSTGRES_PASSWORD)
#   docker compose up --wait
#   docker compose --profile tools run --rm psql     (a SQL prompt, only when you ask for it)
#   docker compose watch                              (rebuilds a service when its source changes)
name: daftar

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  db:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_USER: daftar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: daftar
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daftar -d daftar"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 256m
    pids_limit: 100
    restart: unless-stopped
    # No "ports": only the other services can reach the database.

  api:
    <<: *hardening
    build:
      context: ./api
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    environment:
      DATABASE_URL: postgres://daftar:${POSTGRES_PASSWORD}@db:5432/daftar
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 2s
      retries: 10
    mem_limit: 256m
    pids_limit: 100
    ports:
      - "127.0.0.1:8080:8080"
    develop:
      watch:
        - action: rebuild
          path: ./api/server.mjs
        - action: rebuild
          path: ./api/package.json

  worker:
    <<: *hardening
    build:
      context: ./worker
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    environment:
      API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/heartbeat') < 10 else 1)"]
      interval: 3s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    pids_limit: 50
    develop:
      watch:
        - action: rebuild
          path: ./worker/worker.py

  web:
    <<: *hardening
    build:
      context: ./web
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 10
    mem_limit: 64m
    pids_limit: 50
    ports:
      - "127.0.0.1:3000:8080"

  psql:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    profiles: [tools]
    entrypoint: ["psql"]
    command: ["-h", "db", "-U", "daftar", "daftar"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
