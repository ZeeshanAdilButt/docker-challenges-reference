# GitHub Actions workflow for part 3 (stretch). Copy it to .github/workflows/multiplatform.yml in your own repository.
# Every action is pinned to a full commit SHA. The tag in the comment is what the SHA was when this was written.
name: build-multiplatform

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare the build folder
        run: |
          mkdir build-ctx
          cp challenges/challenge-5-fast-builds/app/package.json challenges/challenge-5-fast-builds/app/package-lock.json daftar-api/server.mjs build-ctx/
          cp challenges/challenge-5-fast-builds/part-2-cache-backends/Dockerfile build-ctx/

      # QEMU lets an amd64 runner run arm64 programs. It is slow. A native arm64 runner is faster.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build-ctx
          platforms: linux/amd64,linux/arm64
          push: false
          tags: daftar-api:ci
