# The full local stack, fixed: health checks, ordered start, a one-shot migration, restart policies,
# retries in the app, and the psql tool behind a profile.
name: dkr-c8

x-safe: &safe
  labels:
    dkr.challenge: "8"
  mem_limit: 128m
  memswap_limit: 128m
  pids_limit: 100
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "1m", max-file: "2" }

x-app: &app
  <<: *safe
  image: dkr-c8-stack:1
  restart: unless-stopped
  environment:
    DB_HOST: db
    DB_PASSWORD: dkr-demo-only
    CACHE_HOST: cache
    STARTUP_RETRIES: "30"      # the app's half of "wait for the database"
    STARTUP_RETRY_MS: "500"
  depends_on:
    db: { condition: service_healthy }
    cache: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

services:
  db:
    <<: *safe
    image: postgres:18-alpine
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: dkr-demo-only
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  cache:
    <<: *safe
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  migrate:
    <<: *safe
    image: postgres:18-alpine
    restart: "no"
    entrypoint: ["psql", "-h", "db", "-U", "postgres", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/001_create_tables.sql"]
    environment:
      PGPASSWORD: dkr-demo-only
    volumes: ["../../stack/migrations:/migrations:ro"]
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *app
    ports: ["127.0.0.1:${API_PORT}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready > /dev/null"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s

  worker:
    <<: *app
    command: ["node", "src/worker.mjs"]

  # A tool, not part of the stack. Start it on demand: docker compose --profile tools run --rm psql -c "\dt"
  psql:
    <<: *safe
    profiles: ["tools"]
    image: postgres:18-alpine
    entrypoint: ["psql", "-h", "db", "-U", "postgres"]
    environment:
      PGPASSWORD: dkr-demo-only
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
    labels:
      dkr.challenge: "8"

networks:
  default:
    labels:
      dkr.challenge: "8"
